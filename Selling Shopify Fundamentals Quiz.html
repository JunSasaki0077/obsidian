<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selling Shopify Fundamentals Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root {
    --bg:#ffffff;--text:#111111;--muted:#666666;--border:#dddddd;
    --card:#ffffff;--correct:#2d7a2d;--wrong:#c0392b;--accent:#111111;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f5f5f5;color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding:32px 16px 90px;}
  header{text-align:center;margin-bottom:28px;border-bottom:2px solid #111;padding-bottom:20px;max-width:720px;margin-left:auto;margin-right:auto;}
  header h1{font-weight:700;font-size:clamp(1.3rem,3vw,1.8rem);color:#111;margin-bottom:6px;letter-spacing:-.01em;}
  header p{color:var(--muted);font-size:.88rem;}
  .prog-wrap{max-width:720px;margin:0 auto 6px;background:#ddd;height:4px;}
  .prog-fill{height:100%;background:#111;transition:width .4s ease;}
  .prog-label{max-width:720px;margin:0 auto 16px;display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);padding-top:5px;}
  .score-row{max-width:720px;margin:0 auto 20px;display:flex;gap:10px;}
  .pill{padding:3px 12px;font-weight:700;font-size:.78rem;border:1px solid;}
  .pill.c{color:var(--correct);border-color:var(--correct);}
  .pill.w{color:var(--wrong);border-color:var(--wrong);}
  .quiz{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
  .card{background:#fff;border:1px solid var(--border);padding:20px 20px 16px;border-left:3px solid #111;}
  .card.cc{border-left-color:var(--correct);}
  .card.wc{border-left-color:var(--wrong);}
  .qnum{font-size:.72rem;font-weight:700;color:#999;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;}
  .qen{font-size:.93rem;line-height:1.7;font-weight:500;margin-bottom:4px;}
  .qja{font-size:.84rem;color:var(--muted);line-height:1.7;margin-bottom:12px;}
  .qinst{font-size:.75rem;color:#999;margin-bottom:11px;}
  .choices{display:flex;flex-direction:column;gap:6px;}
  .cb{background:#fff;border:1px solid #ccc;padding:10px 14px;color:#111;font-family:'Noto Sans JP',sans-serif;font-size:.85rem;line-height:1.5;text-align:left;cursor:pointer;transition:border-color .1s,background .1s;display:flex;align-items:flex-start;gap:10px;width:100%;}
  .cb:hover:not(:disabled){background:#f5f5f5;border-color:#999;}
  .cm{width:18px;height:18px;min-width:18px;border-radius:50%;border:1.5px solid #bbb;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;transition:all .1s;flex-shrink:0;}
  .multi .cm{border-radius:3px;}
  .cb.sel{border-color:#111;}
  .cb.sel .cm{background:#111;border-color:#111;color:#fff;}
  .cb.ok{background:#f0f7f0!important;border-color:var(--correct)!important;}
  .cb.ok .cm{background:var(--correct)!important;border-color:var(--correct)!important;color:#fff!important;}
  .cb.ng{background:#fdf2f2!important;border-color:var(--wrong)!important;}
  .cb.ng .cm{background:var(--wrong)!important;border-color:var(--wrong)!important;color:#fff!important;}
  .cb.rc{background:#f0f7f0!important;border-color:#aaccaa!important;}
  .cb.rc .cm{border-color:var(--correct)!important;color:var(--correct)!important;}
  .cb:disabled{cursor:default;}
  .badge{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;margin-top:10px;border:1px solid;}
  .badge.c{color:var(--correct);border-color:var(--correct);}
  .badge.w{color:var(--wrong);border-color:var(--wrong);}
  .ans-box{margin-top:8px;padding:10px 12px;background:#f9f9f9;border:1px solid #ddd;border-left:3px solid var(--correct);font-size:.82rem;line-height:1.7;}
  .ans-box .al{color:var(--correct);font-weight:700;font-size:.72rem;margin-bottom:3px;}
  #results{display:none;max-width:720px;margin:0 auto;text-align:center;padding:48px 24px;}
  #results h2{font-size:1.5rem;font-weight:700;color:#111;margin-bottom:14px;}
  .sbig{font-size:5rem;font-weight:700;color:#111;line-height:1;}
  .ssub{color:var(--muted);margin:12px 0 28px;font-size:.95rem;}
  .srow{display:flex;justify-content:center;gap:16px;margin-bottom:32px;}
  .btn{background:#111;border:none;padding:12px 32px;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:.95rem;color:#fff;cursor:pointer;transition:opacity .2s;}
  .btn:hover{opacity:.75;}
  .sbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:11px 20px;display:flex;justify-content:center;align-items:center;gap:20px;z-index:100;}
  .sbar span{font-size:.82rem;color:#666;}
</style>
</head>
<body>
<header>
  <h1>Selling Shopify Fundamentals Quiz</h1>
  <p>選択すると即座に正解・不正解がわかります</p>
  <p style="margin-top:10px;font-size:.82rem;">📖 参考教材：<a href="https://www.shopifyacademy.com/path/selling-shopify-fundamentals-ja" target="_blank" style="color:#111;text-decoration:underline;">Selling Shopify Fundamentals</a></p>
</header>
<div class="prog-wrap"><div class="prog-fill" id="pf" style="width:0%"></div></div>
<div class="prog-label"><span id="pt">0 / 42 回答済み</span><span id="pp">0%</span></div>
<div class="score-row">
  <span class="pill c">✓ 正解: <b id="cc">0</b></span>
  <span class="pill w">✗ 不正解: <b id="wc">0</b></span>
</div>
<div class="quiz" id="quiz"></div>
<div id="results">
  <h2>クイズ完了！</h2>
  <div class="sbig" id="sb"></div>
  <div class="ssub" id="ss"></div>
  <div class="srow">
    <span class="pill c">✓ 正解 <b id="fc"></b>問</span>
    <span class="pill w">✗ 不正解 <b id="fw"></b>問</span>
  </div>
  <button class="btn" onclick="location.reload()">もう一度挑戦する</button>
</div>
<div class="sbar">
  <span>回答済み <b id="sa">0</b>/42</span>
  <span style="color:var(--correct)">✓ <b id="sc">0</b></span>
  <span style="color:var(--wrong)">✗ <b id="sw">0</b></span>
  <button class="btn" id="subBtn" style="display:none;padding:9px 22px;font-size:.88rem" onclick="showResults()">結果を見る</button>
</div>
<script>
const QS=[
  {num:1,multi:false,en:"When discussing Shopify Plus with a client, you reference the new advertising regulations that are increasing acquisition costs. What step in the value pitch process does this action align to?",ja:"クライアントとShopify Plusについて話し合う際、顧客獲得コストを増大させている新しい広告規制に言及しました。この行動は、価値提案（バリューピッチ）プロセスのどのステップに該当しますか？",inst:"Select the correct answer.",choices:["課題の枠組みを定義する (Frame the challenge)","なぜShopify Plusを選ぶのか (Why choose Shopify Plus)","対話をカスタマイズする (Customize the interaction)","ディスカバリー・リサーチを調査する (Investigate discovery research)"],ans:["課題の枠組みを定義する (Frame the challenge)"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:2,multi:false,en:'"Technical teams protecting their territory" is a common objection to manage for which segment of merchant?',ja:"「自分たちの領域を守ろうとする技術チーム」への対応は、どのセグメントのマーチャントにおいてよく見られる反対意見ですか？",inst:"Select the correct answer.",choices:["Large segment","High-complexity segment","Mid-market segment","Enterprise segment"],ans:["Enterprise segment"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:3,multi:false,en:"How long after lead submission must a conversion take place for a Partner to be eligible for revenue share?",ja:"パートナーがレベニューシェアの対象となるには、リード提出からどのくらいの期間内に成約が発生する必要がありますか？",inst:"Select the correct answer.",choices:["60 days","30 days","180 days","90 days"],ans:["90 days"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:4,multi:false,en:"When preparing a Shopify value pitch, which area of a merchant's business is it most important to align to?",ja:"Shopifyの価値提案を準備する際、マーチャントのビジネスのどの領域に内容を合わせることが最も重要ですか？",inst:"Select the correct answer.",choices:["The new markets they can expand to / 拡大可能な新しい市場","The feature parity from their existing platform / 既存プラットフォームとの機能の同等性","Their excitement to innovate / イノベーションへの意欲","Their top predicted challenges / 予測される最大の課題"],ans:["Their top predicted challenges / 予測される最大の課題"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:5,multi:false,en:"Which of the following business priorities best aligns with mid-market retailers?",ja:"次のビジネス優先事項のうち、ミッドマーケットの小売業者に最も適しているのはどれですか？",inst:"Select the correct answer.",choices:["Driving revenue and market share while reducing costs / コストを削減しながら、収益と市場シェアを拡大する","Implementing a tech stack with specialty services / 専門サービスを備えた技術スタックを導入する","Reducing their time-to-market for new products / 新製品の市場投入までの時間を短縮する","Innovating with specialty product lines and collaborations with influencers / 専門的な製品ラインの革新やインフルエンサーとのコラボレーションを行う"],ans:["Driving revenue and market share while reducing costs / コストを削減しながら、収益と市場シェアを拡大する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:6,multi:false,en:"Which is a recommended strategy for handling objections effectively?",ja:"反対意見（オブジェクション）に効果的に対処するために推奨される戦略はどれですか？",inst:"Select the correct answer.",choices:["Review whether there is a discount or promotion to entice the merchant / マーチャントを惹きつけるための割引やプロモーションがあるか確認する","Validate the merchant's concerns to build trust / 信頼を築くために、マーチャントの懸念を肯定する","Move past minor objections to focus on major issues / 主要な問題に集中するため、些細な反対意見は聞き流す","Debate their concerns with data and facts / データと事実を用いて相手の懸念に反論する"],ans:["Validate the merchant's concerns to build trust / 信頼を築くために、マーチャントの懸念を肯定する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:7,multi:true,en:"A prospective brand is currently on an open-source platform and is concerned about Shopify feeling too rigid. Which two statements will accurately alleviate this concern?",ja:"あるブランドが現在オープンソースのプラットフォームを利用しており、Shopifyは柔軟性に欠けるのではないかと懸念しています。この懸念を正確に解消できる記述はどれですか？（2つ選択）",inst:"Select the two correct answers.",choices:["Shopify lets you select a maintenance cycle so downtime has minimal disruption on your business","Shopify offers extensibility tools to customize the experience","The Admin API will let you make modifications to Shopify's core code","You can access a vast app ecosystem for business functions not available out of the box"],ans:["Shopify offers extensibility tools to customize the experience","You can access a vast app ecosystem for business functions not available out of the box"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:8,multi:false,en:"How can a Sales Development Representative co-sell with partners in the pre-contract phase?",ja:"SDRは、契約前の段階でどのようにパートナーと共同販売を行いますか？",inst:"Select the correct answer.",choices:["Qualify merchants to ensure they are a good fit","Provide technical support for partners and merchants","Share any ongoing promotions to entice the merchants to sign","Approve development stores so partners can build proof-of-concepts"],ans:["Qualify merchants to ensure they are a good fit"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:9,multi:true,en:"In which two ways can a Shopify Account Executive add value to your selling process?",ja:"Shopifyのアカウント・エグゼクティブ（AE）は、どのような方法で販売プロセスに価値を加えることができますか？（2つ選択）",inst:"Select the two correct answers.",choices:["Share realistic timelines on the upgrade process","Offer training to merchants once they're on the Shopify platform","Provide technical troubleshooting for API issues","Answer product fit questions"],ans:["Share realistic timelines on the upgrade process","Answer product fit questions"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:10,multi:false,en:"A merchant mentions they use manual processes for a significant portion of their workflows. Which question will help you identify the potential areas for automation?",ja:"マーチャントが「ワークフローの大部分を手作業で行っている」と述べています。自動化の可能性がある領域を特定するのに役立つ質問はどれですか？",inst:"Select the correct answer.",choices:["What software are you currently using for task management? / タスク管理に現在どのようなソフトウェアを使用していますか？","How many employees are managing these tasks? / それらのタスクを何人の従業員で管理していますか？","How much of your workflow currently relies on repetitive tasks? / 現在のワークフローのうち、繰り返し作業はどの程度ありますか？","Have you considered using automated tools before? / 以前に自動化ツールの使用を検討したことはありますか？"],ans:["How much of your workflow currently relies on repetitive tasks? / 現在のワークフローのうち、繰り返し作業はどの程度ありますか？"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:11,multi:false,en:"What is the first step to determine if there's a good fit for a prospective merchant?",ja:"見込みマーチャントが自社に適しているかどうかを判断するための、最初のステップは何ですか？",inst:"Select the correct answer.",choices:["Research the prospective merchant through publicly available information / 公開されている情報を通じて、その見込みマーチャントについて調査する","Find merchants in similar verticals already using Shopify / すでにShopifyを利用している、同業種のマーチャントを探す","Review their current platform to compare its capabilities to Shopify / 現在のプラットフォームを確認し、Shopifyの機能と比較する","Analyze their KPIs and opportunities for improvement / 彼らのKPIと改善の機会を分析する"],ans:["Research the prospective merchant through publicly available information / 公開されている情報を通じて、その見込みマーチャントについて調査する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:12,multi:false,en:"What does a Merchant Success Manager do for a business once they've launched on Shopify Plus or Enterprise?",ja:"マーチャント・サクセス・マネージャー（MSM）は、ビジネスがShopify Plusまたはエンタープライズでローンチした後、何を行いますか？",inst:"Select the correct answer.",choices:["Provide training on the Shopify platform / Shopifyプラットフォームに関するトレーニングを提供する","Build scopes of work for projects / プロジェクトの業務範囲（SOW）を作成する","Act as an internal advocate for that business with Shopify teams / Shopify社内において、そのビジネスの代弁者（アドボケイト）として活動する","Offer technical support and troubleshooting / 技術サポートやトラブルシューティングを提供する"],ans:["Act as an internal advocate for that business with Shopify teams / Shopify社内において、そのビジネスの代弁者（アドボケイト）として活動する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:13,multi:false,en:"Which of the following is a common objection for mid-market segment merchants?",ja:"ミッドマーケットセグメントのマーチャントによく見られる反対意見はどれですか？",inst:"Select the correct answer.",choices:["Internal politics / 社内政治","Fear of losing what's been built / 構築してきたものを失うことへの恐怖","Not enough integrations / 統合（インテグレーション）の不足","Lack of ERP options / ERPの選択肢の欠如"],ans:["Fear of losing what's been built / 構築してきたものを失うことへの恐怖"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:14,multi:false,en:"How should you handle an objection from an enterprise account that believes Shopify is only suitable for small businesses?",ja:"「Shopifyは小規模ビジネス向けだ」と思い込んでいるエンタープライズアカウントからの異議に、どのように対処すべきですか？",inst:"Select the correct answer.",choices:["Challenge the misconception by showcasing case studies of enterprise brands on Shopify / エンタープライズブランドの導入事例（ケーススタディ）を紹介し、誤解を解く","Highlight Shopify's extensive app marketplace and customization capabilities / Shopifyの広範なアプリマーケットプレイスとカスタマイズ機能の高さを強調する","Suggest they experiment with Shopify by migrating a sub-brand of their business first / まずはサブブランドの移行から始めて、Shopifyを試してみることを提案する","Recommend a headless build so the brand can have more flexibility in store design / 店舗デザインの柔軟性を高めるために、ヘッドレス構成（Headless build）を推奨する"],ans:["Challenge the misconception by showcasing case studies of enterprise brands on Shopify / エンタープライズブランドの導入事例（ケーススタディ）を紹介し、誤解を解く"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:15,multi:false,en:"Which of the following accurately describes how Shopify Sales works with Partners on leads?",ja:"Shopifyのセールスチームが、リード（案件）に関してパートナーとどのように連携するかについて、正しく述べているのはどれですか？",inst:"Select the correct answer.",choices:["Partners choose to either hand-off the lead completely for a referral fee or work the lead alone / パートナーは、紹介料を受け取って案件を完全に引き渡すか、あるいは単独で案件を進めるかのどちらかを選択する","Shopify Sales generates all the leads and chooses the most appropriate Partner based on their profile / Shopifyのセールスチームがすべてのリードを生成し、最適なパートナーを選定する","Shopify expects Partners to work the lead as far as they can alone and then hand-off to Shopify sales / Shopifyは、パートナーが可能な限り単独で案件を進め、その後にShopifyのセールスチームへ引き継ぐことを期待している","Partners can choose their level of involvement when they submit the referral form / パートナーは、リファラルフォームを提出する際に、自身の関与度合いを選択することができる"],ans:["Partners can choose their level of involvement when they submit the referral form / パートナーは、リファラルフォームを提出する際に、自身の関与度合いを選択することができる"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:16,multi:false,en:"You heard through your network that a major ecommerce brand is considering leaving their current platform. Do you have the information required to submit a lead to Shopify?",ja:"あなたのネットワークを通じて、大手ECブランドが現行プラットフォームからの離脱を検討しているという情報を得ました。この情報をShopifyにリードとして提出するために必要な情報は揃っていますか？",inst:"Select the correct answer.",choices:["No; you should have direct contact with a brand before submitting a lead / いいえ。リードを提出する前に、ブランドと直接コンタクトを取っている必要があります。","Yes; Shopify Sales can help to find a contact at this brand / はい。Shopifyセールスがそのブランドの担当者を探すのを手伝ってくれます。","No; Shopify needs to have an RFP before they can engage with the brand / いいえ。Shopifyが関与するには、まず提案依頼書（RFP）が必要です。","Yes; you should submit a lead as early as possible to ensure you earn commission / はい。報酬を確実にするため、できるだけ早くリードを提出すべきです。"],ans:["No; you should have direct contact with a brand before submitting a lead / いいえ。リードを提出する前に、ブランドと直接コンタクトを取っている必要があります。"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:17,multi:false,en:"While in a discovery call with a merchant, they mention a value of their brand is creating unique shopping experiences to delight their customers. Which value pillar would be most relevant?",ja:"マーチャントとのヒアリング中に、「ユニークなショッピング体験を作り出すことがブランドの価値だ」と言われました。最も関連するバリューピラーはどれですか？",inst:"Select the correct answer.",choices:["Operate with confidence / 自信を持って業務を遂行","Speed and agility / スピードと俊敏性","Innovation you can customize / カスタマイズ可能なイノベーション","Meet your buyers where they're at / 顧客の求めるニーズに応える"],ans:["Innovation you can customize / カスタマイズ可能なイノベーション"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:18,multi:false,en:"Which statement accurately describes an activity undertaken in the 'progress' phase of the Shopify value pitch process?",ja:"Shopifyのバリューピッチプロセスの「進捗（Progress）」フェーズで行われる活動として、正しく述べているのはどれですか？",inst:"Select the correct answer.",choices:["Predict the prospect's top three challenges / 見込み客が抱える上位3つの課題を予測する","Complete the sale and discuss delivery timelines / 販売を完了し、納期について話し合う","Send follow-up emails to request more detailed requirements / より詳細な要件を依頼するために、フォローアップのメールを送信する","Customize your presentation deck based on general industry data / 一般的な業界データに基づいて、プレゼンテーション資料をカスタマイズする"],ans:["Send follow-up emails to request more detailed requirements / より詳細な要件を依頼するために、フォローアップのメールを送信する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:19,multi:true,en:"Which two traits are common for selling to enterprise brands?",ja:"エンタープライズブランドへの販売に共通する特徴はどれですか？（2つ選択）",inst:"Select the two correct answers.",choices:["Required co-selling with Shopify / Shopifyとの共同販売が必要","Rapid decision-making / 迅速な意思決定","Complex tech stacks / 複雑な技術スタック","Longer evaluation timelines / 長期にわたる検討期間"],ans:["Complex tech stacks / 複雑な技術スタック","Longer evaluation timelines / 長期にわたる検討期間"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:20,multi:false,en:"Jamison Jewels is concerned about the increasing cost of IT as their business grows. Which question would help you best understand the scope of their problem?",ja:"Jamison Jewelsは、ビジネスの成長に伴うITコストの増大を懸念しています。問題の全容を最もよく理解するために役立つ質問はどれですか？",inst:"Select the correct answer.",choices:["What specific IT challenges are you facing now? / 現在直面している具体的なITの課題は何ですか？","When did you notice an increase in IT costs? / ITコストの増加に気づいたのはいつですか？","How often do you require IT maintenance? / どのくらいの頻度でITメンテナンスが必要ですか？","What is your current IT maintenance budget? / 現在のITメンテナンス予算はいくらですか？"],ans:["What specific IT challenges are you facing now? / 現在直面している具体的なITの課題は何ですか？"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},

  {num:37,multi:false,en:"What is the main focus of how the Shopify Launch Engineering team works with merchants?",ja:"Shopify ローンチ・エンジニアリング・チームがマーチャントと連携する際の主な焦点は何ですか？",inst:"Select the correct answer.",choices:["Review code to ensure an error-free migration / エラーのない移行を確実にするため、コードをレビューする","Help the merchant translate business problems to technical solutions / マーチャントがビジネス上の問題を技術的なソリューションに置き換えるのを支援する","Train the merchant's staff on how to use Shopify / マーチャントのスタッフにShopifyの使用方法をトレーニングする","Implement technical solutions for the merchant / マーチャントのために技術的なソリューションを実装する"],ans:["Help the merchant translate business problems to technical solutions / マーチャントがビジネス上の問題を技術的なソリューションに置き換えるのを支援する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:38,multi:true,en:"You've just logged in to your partner dashboard and noticed a lead you've recently submitted was marked ineligible. What would cause this to happen?",ja:"パートナーダッシュボードにログインしたところ、最近提出したリードが「不適格（ineligible）」とマークされていました。何が原因と考えられますか？（2つ選択）",inst:"Select the two correct answers.",choices:["Shopify has already engaged with this merchant / Shopifyがすでにそのマーチャントと接触している","You didn't respond to outreach from Shopify in a timely manner / Shopifyからの連絡にタイムリーに回答しなかった","The merchant indicated they are not interested in working with you / マーチャントがあなたとの協力を希望しない旨を示した","The merchant is on a platform that cannot be migrated to Shopify / マーチャントがShopifyに移行できないプラットフォームを利用している"],ans:["Shopify has already engaged with this merchant / Shopifyがすでにそのマーチャントと接触している","You didn't respond to outreach from Shopify in a timely manner / Shopifyからの連絡にタイムリーに回答しなかった"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},
  {num:39,multi:false,en:"Oil On Canvas is an art supply store that sold $400,000 in GMV last year. They are currently operating on WooCommerce but are concerned about their technical costs rising if they move to Shopify. How would you respond to this concern?",ja:"「Oil On Canvas」は昨年40万ドルのGMVを売り上げた画材店です。現在はWooCommerceを利用していますが、Shopifyに移ると技術的コストが上がるのではないかと懸念しています。この懸念にどう対処しますか？",inst:"Select the correct answer.",choices:["Demonstrate free tools like the bulk product importer to help with the migration and reduce costs / 移行を支援しコストを削減するために、一括商品インポーターのような無料ツールをデモンストレーションする","Explain that while platform costs may be higher, total cost of ownership can be lower due to reduced reliance on apps or development costs / プラットフォーム自体のコストは上がるかもしれないが、アプリや開発コストへの依存が減るため、保有総コスト（TCO）は下がる可能性があると説明する","Confirm that Shopify's fees are higher than WooCommerce, but you get more value in return / Shopifyの料金はWooCommerceよりも高いことを認めた上で、それ以上の価値が得られると主張する","Work with Shopify Sales to see whether a price-match is possible in order to win this account / この案件を獲得するために、価格マッチングが可能かどうかShopifyセールスと調整する"],ans:["Explain that while platform costs may be higher, total cost of ownership can be lower due to reduced reliance on apps or development costs / プラットフォーム自体のコストは上がるかもしれないが、アプリや開発コストへの依存が減るため、保有総コスト（TCO）は下がる可能性があると説明する"],url:"https://www.shopifyacademy.com/path/selling-shopify-fundamentals"},

];

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

const qs=shuf(QS).map(q=>({...q,sc:shuf(q.choices),sel:new Set(),done:false}));
let tA=0,tC=0,tW=0;

function upd(){
  const p=tA/qs.length*100;
  document.getElementById('pf').style.width=p+'%';
  document.getElementById('pt').textContent=`${tA} / ${qs.length} 回答済み`;
  document.getElementById('pp').textContent=Math.round(p)+'%';
  ['cc','sc'].forEach(id=>document.getElementById(id).textContent=tC);
  ['wc','sw'].forEach(id=>document.getElementById(id).textContent=tW);
  document.getElementById('sa').textContent=tA;
  if(tA===qs.length)document.getElementById('subBtn').style.display='inline-block';
}

function lock(qi){
  const q=qs[qi];const card=document.getElementById('c'+qi);
  const ok=!q.dummy&&q.ans.length===q.sel.size&&q.ans.every(a=>q.sel.has(a));
  q.done=true;
  card.querySelectorAll('.cb').forEach(btn=>{
    btn.disabled=true;
    const ch=btn.dataset.c;
    const isAns=q.ans.includes(ch);const isSel=q.sel.has(ch);
    const m=btn.querySelector('.cm');
    if(q.dummy){
      if(isSel){btn.classList.add('ng');m.textContent='✗';}
    } else {
      if(isSel&&isAns){btn.classList.add('ok');m.textContent='✓';}
      else if(isSel&&!isAns){btn.classList.add('ng');m.textContent='✗';}
      else if(!isSel&&isAns){btn.classList.add('rc');m.textContent='✓';}
    }
  });
  card.classList.add(ok?'cc':'wc');
  const b=document.createElement('div');
  b.className='badge '+(ok?'c':'w');
  b.textContent=ok?'✓ 正解！':'✗ 不正解';
  card.appendChild(b);
  if(!ok){
    const box=document.createElement('div');
    box.className='ans-box';
    const ansText=q.dummy?'この問題には正解がありません':q.ans.join('　／　');
    box.innerHTML=`<div class="al">✓ 正解</div><div>${ansText}</div>`;
    card.appendChild(box);
  }
  tA++;if(ok)tC++;else tW++;upd();
}

function pick(qi,ch,btn){
  const q=qs[qi];if(q.done)return;
  if(q.multi){
    if(q.sel.has(ch)){q.sel.delete(ch);btn.classList.remove('sel');btn.querySelector('.cm').textContent='';}
    else{q.sel.add(ch);btn.classList.add('sel');btn.querySelector('.cm').textContent='✓';}
    if(q.sel.size===q.ans.length)lock(qi);
  }else{
    q.sel.clear();q.sel.add(ch);lock(qi);
  }
}

function build(){
  const cont=document.getElementById('quiz');
  qs.forEach((q,qi)=>{
    const card=document.createElement('div');
    card.className='card';card.id='c'+qi;
    card.innerHTML=`<div class="qnum">問 ${qi+1}</div><div class="qen">${q.en}</div><div class="qja">${q.ja}</div><div class="qinst">${q.inst}</div><div class="choices" id="ch${qi}"></div>`;
    const cd=card.querySelector('#ch'+qi);
    q.sc.forEach(ch=>{
      const btn=document.createElement('button');
      btn.className='cb'+(q.multi?' multi':'');btn.dataset.c=ch;
      btn.innerHTML=`<span class="cm"></span><span>${ch}</span>`;
      btn.onclick=()=>pick(qi,ch,btn);
      cd.appendChild(btn);
    });
    cont.appendChild(card);
  });
}

function showResults(){
  ['quiz','prog-wrap','.score-row'].forEach(id=>{const el=document.getElementById(id)||document.querySelector(id);if(el)el.style.display='none';});
  document.querySelector('.prog-wrap').style.display='none';
  document.querySelector('.prog-label').style.display='none';
  document.querySelector('.score-row').style.display='none';
  document.querySelector('.sbar').style.display='none';
  document.getElementById('quiz').style.display='none';
  const pct=Math.round(tC/qs.length*100);
  document.getElementById('sb').textContent=pct+'%';
  document.getElementById('ss').textContent=pct>=80?'素晴らしい！合格圏内です 🎉':pct>=60?'あと少し！もう一度挑戦してみましょう 💪':'復習して再挑戦しましょう 📚';
  document.getElementById('fc').textContent=tC;
  document.getElementById('fw').textContent=tW;
  document.getElementById('results').style.display='block';
}

build();upd();
</script>
</body>
</html>
